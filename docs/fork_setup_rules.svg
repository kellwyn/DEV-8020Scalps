<?xml version="1.0" encoding="UTF-8"?>
<svg width="920" height="600" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="920" height="600" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="460" y="36" text-anchor="middle" font-size="16" font-weight="bold" fill="#e0e0e0">Fork Setup — Entry Rules (Long Reversal at 20/80 Level)</text>

  <!-- ═══ CHART AREA ═══ -->
  <rect x="80" y="55" width="480" height="480" fill="#0d1b2a" rx="5"/>

  <!-- Subtle grid -->
  <g stroke="#162030" stroke-width="1">
    <line x1="80" y1="130" x2="560" y2="130"/>
    <line x1="80" y1="200" x2="560" y2="200"/>
    <line x1="80" y1="300" x2="560" y2="300"/>
    <line x1="80" y1="390" x2="560" y2="390"/>
    <line x1="80" y1="460" x2="560" y2="460"/>
  </g>

  <!-- 20/80 LEVEL LINE -->
  <line x1="80" y1="235" x2="560" y2="235" stroke="#ffd700" stroke-width="2" stroke-dasharray="9,5"/>
  <rect x="80" y="222" width="80" height="16" fill="#1a1500"/>
  <text x="120" y="234" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffd700">20/80 Level</text>

  <!-- ═══ BAR 3 — Context (grey, muted) ═══ -->
  <!-- H=85  O=105  C=148  L=168 -->
  <g opacity="0.45">
    <line x1="155" y1="85"  x2="155" y2="105" stroke="#7a8a9a" stroke-width="2"/>
    <rect x="138" y="105" width="34" height="43" fill="#5a6a7a" rx="1"/>
    <line x1="155" y1="148" x2="155" y2="168" stroke="#7a8a9a" stroke-width="2"/>
  </g>
  <text x="155" y="550" text-anchor="middle" font-size="11" fill="#5a6a7a">Bar 3</text>
  <text x="155" y="563" text-anchor="middle" font-size="10" fill="#4a5060">(context)</text>

  <!-- ═══ BAR 2 — Rejection candle (bearish, HUGE lower wick) ═══ -->
  <!-- H=130  O=148  C=215  L=460  — Range=330px  Wick=245px  Ratio=0.74 -->
  <line x1="295" y1="130" x2="295" y2="148" stroke="#e94560" stroke-width="2.5"/>
  <rect x="276" y="148" width="38" height="67" fill="#e94560" rx="1"/>
  <line x1="295" y1="215" x2="295" y2="460" stroke="#e94560" stroke-width="3"/>
  <text x="295" y="550" text-anchor="middle" font-size="11" fill="#e0e0e0" font-weight="bold">Bar 2</text>
  <text x="295" y="563" text-anchor="middle" font-size="10" fill="#e94560">(rejection)</text>

  <!-- ═══ BAR 1 — Confirmation (bullish, lo1 > lo2) ═══ -->
  <!-- H=178  C=190 (close=top of body)  O=228 (open=bottom)  L=432 -->
  <line x1="435" y1="178" x2="435" y2="190" stroke="#0f9b58" stroke-width="2.5"/>
  <rect x="418" y="190" width="34" height="38" fill="#0f9b58" rx="1"/>
  <line x1="435" y1="228" x2="435" y2="432" stroke="#0f9b58" stroke-width="2.5"/>
  <text x="435" y="550" text-anchor="middle" font-size="11" fill="#e0e0e0" font-weight="bold">Bar 1</text>
  <text x="435" y="563" text-anchor="middle" font-size="10" fill="#0f9b58">(confirmation)</text>

  <!-- ═══ ENTRY — Bid at 20/80 level ═══ -->
  <circle cx="505" cy="235" r="6" fill="#ffd700" stroke="#0d1b2a" stroke-width="1.5"/>
  <text x="503" y="225" text-anchor="middle" font-size="9" fill="#ffd700">bid</text>
  <polygon points="516,228  548,235  516,242" fill="#ffd700"/>
  <text x="552" y="231" font-size="12" font-weight="bold" fill="#ffd700">LONG</text>
  <text x="552" y="245" font-size="12" font-weight="bold" fill="#ffd700">ENTRY</text>

  <!-- ═══ RULE 2 annotation — full range bracket (left of Bar2) ═══ -->
  <!-- Double-headed arrow y=130 to y=460 at x=267 -->
  <line x1="267" y1="130" x2="267" y2="460" stroke="#5b9bd5" stroke-width="1.5"/>
  <line x1="264" y1="130" x2="275" y2="130" stroke="#5b9bd5" stroke-width="1.5"/>
  <line x1="264" y1="460" x2="275" y2="460" stroke="#5b9bd5" stroke-width="1.5"/>
  <polygon points="263,136 271,136 267,130" fill="#5b9bd5"/>
  <polygon points="263,454 271,454 267,460" fill="#5b9bd5"/>
  <!-- leader line -->
  <line x1="267" y1="295" x2="572" y2="151" stroke="#5b9bd5" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- ═══ RULE 3 annotation — lower wick bracket (right of Bar2) ═══ -->
  <!-- Shaded wick region y=215 to y=460 -->
  <rect x="315" y="215" width="14" height="245" fill="#ff9800" opacity="0.18" rx="2"/>
  <line x1="315" y1="215" x2="329" y2="215" stroke="#ff9800" stroke-width="1.5"/>
  <line x1="315" y1="460" x2="329" y2="460" stroke="#ff9800" stroke-width="1.5"/>
  <line x1="322" y1="215" x2="322" y2="460" stroke="#ff9800" stroke-width="1.5"/>
  <polygon points="318,221 326,221 322,215" fill="#ff9800"/>
  <polygon points="318,454 326,454 322,460" fill="#ff9800"/>
  <!-- leader line -->
  <line x1="329" y1="337" x2="572" y2="223" stroke="#ff9800" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- ═══ RULE 4 annotation — lo2 line and lo1 marker ═══ -->
  <!-- lo2 dashed line across chart -->
  <line x1="90" y1="460" x2="560" y2="460" stroke="#ab47bc" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.8"/>
  <text x="88" y="473" font-size="10" fill="#ab47bc">lo₂</text>
  <!-- lo1 marker at y=432 (above lo2 = higher price) -->
  <line x1="410" y1="432" x2="472" y2="432" stroke="#ab47bc" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="475" y="436" font-size="10" fill="#ab47bc">lo₁</text>
  <!-- Gap arrow between lo1 and lo2 -->
  <line x1="447" y1="433" x2="447" y2="458" stroke="#ab47bc" stroke-width="1.5"/>
  <polygon points="443,438 451,438 447,432" fill="#ab47bc"/>
  <polygon points="443,455 451,455 447,461" fill="#ab47bc" opacity="0.5"/>
  <!-- leader line -->
  <line x1="505" y1="446" x2="572" y2="295" stroke="#ab47bc" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- ═══ RULE 5 annotation — cl1 marker ═══ -->
  <line x1="418" y1="190" x2="482" y2="190" stroke="#26c6da" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="485" y="194" font-size="10" fill="#26c6da">cl₁</text>
  <!-- leader line -->
  <line x1="482" y1="190" x2="572" y2="367" stroke="#26c6da" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- ═══ RIGHT PANEL ═══ -->
  <rect x="572" y="55" width="334" height="480" fill="#080f1e" rx="5"/>
  <text x="739" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0c0c0">ALL CONDITIONS MUST PASS</text>

  <!-- PRE-CHECK box -->
  <rect x="580" y="80" width="318" height="44" fill="#1a1500" rx="4" stroke="#ffd700" stroke-width="1.2"/>
  <circle cx="597" cy="102" r="10" fill="#ffd700"/>
  <text x="597" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1500">&#10003;</text>
  <text x="614" y="97"  font-size="11" font-weight="bold" fill="#ffd700">PRE-CHECK: Bid at xx20 or xx80 level</text>
  <text x="614" y="112" font-size="10" fill="#a89020">Rules 2–5 only run when Is2080Level() = true</text>

  <!-- RULE 2 box -->
  <rect x="580" y="130" width="318" height="75" fill="#0a1830" rx="4" stroke="#5b9bd5" stroke-width="1.2"/>
  <circle cx="597" cy="150" r="10" fill="#5b9bd5"/>
  <text x="597" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a1830">2</text>
  <text x="614" y="146" font-size="12" font-weight="bold" fill="#5b9bd5">Bar 2 Range &#8805; SL_Points (10 pts)</text>
  <text x="614" y="161" font-size="11" fill="#7090b0">The setup candle must be large enough</text>
  <text x="614" y="175" font-size="11" fill="#7090b0">to be a meaningful rejection</text>
  <text x="614" y="196" font-size="10" fill="#5b9bd5">&#8594; hi2 &#8722; lo2 &#8805; 10 &#160;&#160; filters tiny/choppy bars</text>

  <!-- RULE 3 box -->
  <rect x="580" y="211" width="318" height="75" fill="#1a1000" rx="4" stroke="#ff9800" stroke-width="1.2"/>
  <circle cx="597" cy="231" r="10" fill="#ff9800"/>
  <text x="597" y="236" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1000">3</text>
  <text x="614" y="227" font-size="12" font-weight="bold" fill="#ff9800">Lower Wick &#247; Range &#8805; 0.5</text>
  <text x="614" y="242" font-size="11" fill="#c08030">The wick below the body must be at</text>
  <text x="614" y="256" font-size="11" fill="#c08030">least half the full candle range</text>
  <text x="614" y="277" font-size="10" fill="#ff9800">&#8594; Proves strong buyer rejection at this level</text>

  <!-- RULE 4 box -->
  <rect x="580" y="292" width="318" height="75" fill="#130820" rx="4" stroke="#ab47bc" stroke-width="1.2"/>
  <circle cx="597" cy="312" r="10" fill="#ab47bc"/>
  <text x="597" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#130820">4</text>
  <text x="614" y="308" font-size="12" font-weight="bold" fill="#ab47bc">Bar 1 Low &gt; Bar 2 Low</text>
  <text x="614" y="323" font-size="11" fill="#8850a0">Bar 1 must NOT break below Bar 2's low</text>
  <text x="614" y="337" font-size="11" fill="#8850a0">— the breakdown attempt has failed</text>
  <text x="614" y="358" font-size="10" fill="#ab47bc">&#8594; Failed low = sellers exhausted, bulls in control</text>

  <!-- RULE 5 box -->
  <rect x="580" y="373" width="318" height="75" fill="#001820" rx="4" stroke="#26c6da" stroke-width="1.2"/>
  <circle cx="597" cy="393" r="10" fill="#26c6da"/>
  <text x="597" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#001820">5</text>
  <text x="614" y="389" font-size="12" font-weight="bold" fill="#26c6da">Bar 1 Close &gt; Bar 2 Low + 2 pts</text>
  <text x="614" y="404" font-size="11" fill="#4090a0">Close must recover meaningfully above</text>
  <text x="614" y="418" font-size="11" fill="#4090a0">Bar 2's low — not just clinging to it</text>
  <text x="614" y="439" font-size="10" fill="#26c6da">&#8594; Confirms genuine demand, not a dead-cat</text>

  <!-- RESULT box -->
  <rect x="580" y="454" width="318" height="70" fill="#002800" rx="4" stroke="#00e676" stroke-width="1.5"/>
  <text x="739" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#00e676">&#10003; ALL PASS &#8594; EXECUTE LONG</text>
  <text x="739" y="494" text-anchor="middle" font-size="11" fill="#50c870">Entry = ask  |  SL = ask &#8722; 10 pts</text>
  <text x="739" y="510" text-anchor="middle" font-size="11" fill="#50c870">TP1 = ask + 15 pts  (50% scale-out)</text>

  <!-- Bottom note -->
  <text x="320" y="585" text-anchor="middle" font-size="9.5" fill="#3a5070">
    Bar indices: 0 = forming now, 1 = last closed, 2 = previous. DetectFork() checks bars 1 and 2 only.
  </text>

</svg>
